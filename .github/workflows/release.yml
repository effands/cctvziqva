name: Build Windows installer

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v1.0.21"
        required: true
        default: "v1.0.21"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller playwright
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Set application version from tag
        shell: pwsh
        run: |
          $releaseTag = "${{ inputs.release_tag || github.ref_name }}"
          $version = $releaseTag.TrimStart('v')
          (Get-Content version.py -Raw) -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`"" | Set-Content version.py -Encoding utf8
      - name: Build installer assets
        shell: pwsh
        run: .\build_installer.ps1
      - name: Rename installer for updater
        shell: pwsh
        run: Copy-Item .\dist\CCTV_ZIQVA_Setup_*.exe .\dist\CCTV_ZIQVA_Setup.exe
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/CCTV_ZIQVA_Setup.exe
